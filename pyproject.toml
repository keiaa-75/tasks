[project]
name = "google-tasks-overlay"
version = "0.1.0"
description = "A simple overlay for Google Tasks on Linux."
requires-python = ">=3.8"
dependencies = [
    "pyqt6",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "tenacity",
]

[project.scripts]
google-tasks-overlay = "google_tasks_overlay.main:main"